<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#fff1f6">
  <title>Naooogle Birthday</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- 最初に表示される計算問題画面 -->
  <main id="gatePage" class="gate-page">
    <section class="search-card" aria-labelledby="gateTitle">
      <h1 id="gateTitle" class="naooogle-logo" aria-label="Naooogle">
        <span class="blue">N</span><span class="red">a</span><span class="yellow">o</span><span class="yellow">o</span><span class="blue">g</span><span class="green">l</span><span class="red">e</span>
      </h1>

      <p class="gate-message">誕生日ページへ進むには<br>計算問題を解いてね！</p>
      <p id="mathQuestion" class="math-question" aria-live="polite"></p>

      <form id="passwordForm" class="search-form" autocomplete="off">
        <span class="plus-icon" aria-hidden="true">＋</span>
        <input
          id="answerInput"
          type="number"
          inputmode="numeric"
          pattern="[0-9]*"
          placeholder="答えを入力して右の虫眼鏡マークを押してね"
          aria-label="計算問題の答え"
          required
        >
        <button class="search-button" type="submit" aria-label="答えを送信">⌕</button>
      </form>

      <p id="answerMessage" class="answer-message" aria-live="polite"></p>
      <p class="gate-hint">答えを入力して、右の虫眼鏡マークかEnterを押してね</p>
    </section>
  </main>

  <!-- 正解後に表示される既存のHappy Birthdayページ -->
  <main id="birthdayPage" class="birthday-page" hidden>
    <div class="page">
      <header class="hero">
        <p class="small-title">SPECIAL BIRTHDAY PRESENT</p>
        <h1>Happy Birthday!</h1>
        <p class="description">
          気になるプレゼントを<br>
          タップして開けてみてね！
        </p>
      </header>

      <section class="gift-area" aria-label="プレゼント一覧">
        <button class="gift-button" type="button" data-gift="1" aria-label="プレゼント1を開く">
          <span class="number">1</span>
          <img src="assets/present.png" alt="プレゼントボックス1">
        </button>

        <button class="gift-button" type="button" data-gift="2" aria-label="プレゼント2を開く">
          <span class="number">2</span>
          <img src="assets/present.png" alt="プレゼントボックス2">
        </button>

        <button class="gift-button" type="button" data-gift="3" aria-label="プレゼント3を開く">
          <span class="number">3</span>
          <img src="assets/present.png" alt="プレゼントボックス3">
        </button>

        <button class="gift-button" type="button" data-gift="4" aria-label="プレゼント4を開く">
          <span class="number">4</span>
          <img src="assets/present.png" alt="プレゼントボックス4">
        </button>

        <button class="gift-button" type="button" data-gift="5" aria-label="プレゼント5を開く">
          <span class="number">5</span>
          <img src="assets/present.png" alt="プレゼントボックス5">
        </button>

        <button class="gift-button" type="button" data-gift="6" aria-label="プレゼント6を開く">
          <span class="number">6</span>
          <img src="assets/present.png" alt="プレゼントボックス6">
        </button>
      </section>

      <p class="hint">どれから開けてもOK！</p>
    </div>
  </main>

  <div class="modal" id="giftModal" aria-hidden="true">
    <div class="modal-backdrop" data-close="true"></div>

    <section class="modal-card" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <div class="sparkles" aria-hidden="true">✦　✧　✦</div>
      <p class="opened-label">PRESENT OPEN!</p>
      <h2 id="modalTitle"></h2>
      <div id="modalContent" class="modal-content"></div>

      <button id="closeButton" class="close-button" type="button">
        プレゼントを閉じる
      </button>
    </section>
  </div>

  <div id="confetti" class="confetti" aria-hidden="true"></div>

  <script src="script.js"></script>
</body>
</html>
